<!DOCTYPE html>
<html>
<head>
    <title>Login System</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 8px; }
        button { padding: 8px 16px; }
    </style>
</head>
<body>
    <div id="app">
        <h2>Login</h2>
        {{#if loggedIn}}
            <p>Bienvenido, {{ username }}</p>
            <button onclick="logout()">Cerrar sesión</button>
        {{else}}
            <form id="login-form">
                <div class="form-group">
                    <input type="text" id="username" placeholder="Usuario" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>
                <button type="submit">Ingresar</button>
            </form>
        {{/if}}
    </div>

    <script>
        const API = 'http://localhost:5000';

        async function login() {
            const res = await fetch(`${API}/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: document.getElementById('username').value, password: document.getElementById('password').value})
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('app').innerHTML = `<p>Bienvenido, ${data.username}</p><button onclick="logout()">Cerrar sesión</button>`;
            } else alert(data.message);
        }

        async function logout() {
            await fetch(`${API}/logout`, {method: 'GET'});
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('app').innerHTML = `<h2>Login</h2><form id="login-form"><div class="form-group"><input type="text" id="username" placeholder="Usuario" required></div><div class="form-group"><input type="password" id="password" placeholder="Contraseña" required></div><button type="submit">Ingresar</button></form>`;
        }

        document.getElementById('login-form').addEventListener('submit', e => { e.preventDefault(); login(); });

        // Check auth status
        fetch(`${API}/me`).then(res => res.json()).then(data => {
            if (data.loggedIn) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('app').innerHTML = `<p>Bienvenido, ${data.username}</p><button onclick="logout()">Cerrar sesión</button>`;
            }
        });
    </script>
</body>
</html>
